spring:
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration/schema,classpath:db/migration/data
  datasource:
    url: jdbc:h2:mem:maindb
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true
    properties:
      hibernate:
      #format_sql: true