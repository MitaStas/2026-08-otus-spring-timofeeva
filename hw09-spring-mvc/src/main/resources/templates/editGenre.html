<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit book</title>
    <link rel="stylesheet" th:href="@{/styles.css}" href="/styles.css"/>
</head>
<body>

<form id="edit-form" action="editGenre.html" th:action="@{/genre(id=${genre.id})}" th:method="post" th:object="${genre}">
    <h3 class="title-genres">Книжная коллекция:</h3>

    <div class="row">
        <label for="id-input">ID:</label>
        <input id="id-input" type="text" readonly="readonly" th:field="*{id}" value="1"/>
    </div>

    <div class="row">
        <label for="genre-name-input">Название:</label>
        <input id="genre-name-input" type="text" th:field="*{name}" value="Pushkin"/>
        <div class="errors" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Wrong person name error</div>
    </div>

    <div class="row">
        <button type="submit">Сохранить</button>
        <a href="listGenres.html" th:href="@{/authors}"><button type="button" >Отмена</button></a>
    </div>
</form>

</body>
</html>
